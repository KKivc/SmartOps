# SmartOps Prometheus 配置
# 云服务器部署，被管服务器 node_exporter 将通过 remote_write 或拉取方式接入

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # node_exporter 将被管服务器注册后自动加入
  # - job_name: "node_exporter"
  #   static_configs:
  #     - targets: ["host:9100"]
